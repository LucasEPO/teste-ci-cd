
name: CI - Testes e SBOM

on:
  push:
    branches: [main, demonstracao-vulnerabilidade]
  pull_request:
    branches: [main]

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Auditar dependencias
        run: npm audit --audit-level=high

      - name: Gerar SBOM CycloneDX
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json

      - name: Publicar SBOM como artefato
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.json
          if-no-files-found: error
          retention-days: 30
